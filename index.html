<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фотоконвертер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Фотоконвертер</h1>

    <!-- Видеопоток с камеры -->
    <video id="video" autoplay playsinline style="display: block;"></video>

    <!-- Canvas для фото -->
    <canvas id="canvas" style="display: none;"></canvas>

    <!-- Загруженное фото -->
    <img id="uploaded-image" style="display: none;" alt="Загруженное фото">

    <!-- Кнопки управления -->
    <div>
      <button onclick="setupCamera()">Включить камеру</button>
      <button onclick="stopCamera()" style="background:#dc3545">Выключить камеру</button>
      <button onclick="takePhoto(currentStream)">Сделать фото</button>
    </div>

    <div>
      <label>Загрузить из галереи: </label>
      <input type="file" accept="image/*" onchange="handleFileSelect(event)">
    </div>

    <div>
      <h3>Настройки конвертации:</h3>
      <select id="format">
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="webp">WebP</option>
      </select>
      <label>Качество (0.1–1.0): </label>
      <input type="number" id="quality" value="0.8" min="0.1" max="1" step="0.1">
      <label>Ширина (px): </label>
      <input type="number" id="width" value="" placeholder="Авто">
      <button onclick="convertImage()">Конвертировать</button>
    </div>
    
  </div>

  <script src="script.js"></script>
</body>
</html>
